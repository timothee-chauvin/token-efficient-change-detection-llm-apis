[project]
name = "b3it-demo"
version = "0.1.0"
description = "Terminal replay of B3IT on real data recorded against live LLM API endpoints"
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.22.9",
    "fire>=0.7.1",
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]

[project.scripts]
b3it-demo = "b3it_demo.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "UP", # pyupgrade
    "I",  # isort
]
